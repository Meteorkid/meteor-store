# 阿里云轻量服务器 Nginx 配置 —— 放 /etc/nginx/conf.d/imagentx.top.conf
# 作用：80 跳 443，443 反代到本机 Next.js (127.0.0.1:3000)
#
# 注：CSP 等安全头由 Next 的 proxy.ts 动态生成下发，这里不要重复设置，
#    避免双重 CSP header 让浏览器无所适从。

# 公安备案：日志格式含客户端 IP、请求时间、上游响应时间，留存 ≥ 60 天（由 logrotate 管理）
log_format imagentx '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';

server {
    listen 80;
    server_name www.imagentx.top imagentx.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.imagentx.top imagentx.top;

    # 证书：阿里云免费 DV 证书下载后放到该路径，或 Let's Encrypt
    ssl_certificate     /etc/nginx/ssl/imagentx.top.pem;
    ssl_certificate_key /etc/nginx/ssl/imagentx.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 请求体上限放宽（授权码/订单等 POST 场景），默认 1m 偏小
    client_max_body_size 10m;

    # 显式声明日志路径与格式（公安备案要求日志留存 ≥ 60 天）
    access_log /var/log/nginx/imagentx.top.access.log imagentx;
    error_log  /var/log/nginx/imagentx.top.error.log warn;

    # Ex-Memory 与 Meteor Store 共用的服务间鉴权令牌（文件权限 600）。
    include /etc/nginx/private/ex-memory-proxy-token.conf;

    # 文本类静态资源由 nginx 自己压缩。Next 的 compress 只作用于它自己发出的响应，
    # 下面几个 location 直接发盘、不经过 Node，漏掉这段等于把 css/svg/json 明文发出去。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml model/gltf+json;

    # ---------------------------------------------------------------------------
    # 静态资源直接由 nginx 发盘，不再穿过 Node
    #
    # 这台机器只有 2G 内存，而 public/ 有近 90MB（chakra 的特效视频、骨骼模型的
    # .glb 就占了大头）。原来每个字节都要过一遍 Node 进程，纯属浪费——nginx 发静态
    # 文件还能顺带拿到 sendfile 与原生 Range 支持（视频拖动进度条就靠后者）。
    #
    # 两条 public/ 规则都以 `try_files $uri @app` 收尾：盘上有就发盘，没有就回落给 Node。
    # 这条兜底很关键——正则万一多匹配了某个页面路由（比如将来某个 API 以 .json 结尾），
    # 也只是多一次 stat 失败，不会 404。
    #
    # 缓存头一律用 add_header 而不用 `expires`：两者同时写会发出**两个** Cache-Control 头，
    # 而 `immutable` / `must-revalidate` 只有 add_header 表达得了。
    # ---------------------------------------------------------------------------

    # Next 构建产物：文件名自带 content hash，可以放心永久缓存。
    # `^~` 让它压过下面的正则 location，否则 _next/static 里的 .css 会被正则抢走，
    # 跑去 public/ 找一圈再回落，白白多一次 stat。
    #
    # 这里**不写 `try_files`**：nginx 的 try_files 与 alias 同用时路径拼接会算错
    # （是个陈年已知问题）。而且 _next/static 本来也不该回落给 Node——文件名带 hash，
    # 找不到就是真的没有，404 才是正确答案。
    location ^~ /_next/static/ {
        alias /var/www/meteor-store/.next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Service Worker 与它硬编码引用的那几个文件：**绝不能长缓存**。
    # sw.js 一旦被缓存住，用户就卡在旧 Service Worker 上，连「发一版自注销脚本」
    # 这个唯一的补救手段都推不下去。这几个路径互相硬编码引用，没法靠内容 hash 长缓存。
    # 必须排在下面那条通用规则前面——正则 location 按出现顺序匹配，写反了就被通用规则吃掉。
    location ~ ^/(sw\.js|offline\.html|meteor-runner\.js|manifest\.webmanifest)$ {
        root /var/www/meteor-store/public;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri @app;
    }

    # MediaPipe 运行时包含 .js / .data / .binarypb / .wasm。不能按 .js 全局放行，
    # 否则 /blog/tag/Three.js 这类合法页面会被当成静态文件；按固定目录直出既避免
    # next-intl 重定向，也避免大模型文件经过 Node。
    location ^~ /vendor/mediapipe/ {
        root /var/www/meteor-store/public;
        types {
            application/javascript js;
            application/wasm wasm;
            application/octet-stream data binarypb;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # public/ 下的其余静态资源。
    #
    # **`js` 不在这份后缀名单里**，和 src/proxy.ts 的 matcher 同一个理由：博客标签
    # 是用户可自定义的，`Three.js` 已经是现有文章的标签，拿 `js` 后缀一刀切会让
    # /zh/blog/tag/Three.js 被当成静态文件。public/ 里的脚本只有 sw.js 与
    # meteor-runner.js，已由上一条按文件名单独处理；构建产物的 js 走 _next/static。
    #
    # 缓存只给一天：这些文件名不带 content hash（demo.mp4、alipay-qr.png 都是固定名），
    # 收款码这类还会定期换图，长缓存会把用户留在旧图上。
    location ~* ^/.+\.(png|jpg|jpeg|gif|webp|avif|svg|ico|css|txt|xml|html|json|md|mp4|webm|mov|glb|gltf|bin|wasm|woff|woff2|ttf)$ {
        root /var/www/meteor-store/public;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri @app;
    }

    # ex-memory 本地助手安装包使用版本化路径，直接由 nginx 提供 Range 下载。
    location ^~ /downloads/ex-memory/ {
        alias /var/www/downloads/ex-memory/;
        autoindex off;
        types {
            application/x-apple-diskimage dmg;
            application/json json;
            text/plain sha256;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # 仅供 auth_request 内部子请求使用，浏览器不能直接访问。
    location = /_ex_memory_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/internal/ex-memory-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Ex-Memory-Proxy-Token $ex_memory_proxy_token;
    }

    # Ex-Memory 在线体验：先由 Meteor Store 校验登录态，再转发可信用户身份。
    location ^~ /ex-memory-runtime/ {
        auth_request /_ex_memory_auth;
        auth_request_set $ex_memory_user_id $upstream_http_x_ex_memory_user_id;

        proxy_pass http://127.0.0.1:18000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ex-Memory-User-Id $ex_memory_user_id;
        proxy_set_header X-Ex-Memory-Proxy-Token $ex_memory_proxy_token;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # try_files 的兜底目标：盘上找不到就交回 Node，与 location / 保持一致。
    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
