# 阿里云轻量服务器 Nginx 配置 —— 放 /etc/nginx/conf.d/imagentx.top.conf
# 作用：80 跳 443，443 反代到本机 Next.js (127.0.0.1:3000)
#
# 注：CSP 等安全头由 Next 的 proxy.ts 动态生成下发，这里不要重复设置，
#    避免双重 CSP header 让浏览器无所适从。

server {
    listen 80;
    server_name www.imagentx.top imagentx.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.imagentx.top imagentx.top;

    # 证书：阿里云免费 DV 证书下载后放到该路径，或 Let's Encrypt
    ssl_certificate     /etc/nginx/ssl/imagentx.top.pem;
    ssl_certificate_key /etc/nginx/ssl/imagentx.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 请求体上限放宽（授权码/订单等 POST 场景），默认 1m 偏小
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}