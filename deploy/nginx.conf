# 阿里云轻量服务器 Nginx 配置 —— 放 /etc/nginx/conf.d/imagentx.top.conf
# 作用：80 跳 443，443 反代到本机 Next.js (127.0.0.1:3000)
#
# 注：CSP 等安全头由 Next 的 proxy.ts 动态生成下发，这里不要重复设置，
#    避免双重 CSP header 让浏览器无所适从。

# 公安备案：日志格式含客户端 IP、请求时间、上游响应时间，留存 ≥ 60 天（由 logrotate 管理）
log_format imagentx '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';

# 错误响应不能跟着内容哈希资源缓存一年，否则恢复权限后旧浏览器仍会沿用403。
map $status $meteor_static_cache_control {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

# 「重资源」单 IP 并发连接计数区，供下方 location 里的 limit_conn 使用。
#
# zone 指令只能在 http 上下文声明，而本文件被 nginx.conf 的 include 放在 http 块内，
# 因此写在 server 块之前即可生效。10m 大约可记录 16 万个 IP，当前规模绰绰有余。
limit_conn_zone $binary_remote_addr zone=meteor_heavy_conn:10m;

# 普通 HTTP 请求跳到 https 的 **www**，证书验证目录除外，不用 $host。
# $host 会把 imagentx.top 原样保留，于是非 www 的 http 请求要跳两次才到规范地址，
# 而每一跳都在消耗搜索引擎的抓取预算。
server {
    listen 80;
    server_name www.imagentx.top imagentx.top;

    # webroot 验证复用 Nginx 的80端口，不需要停站给续期程序腾端口。
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/meteor-store-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.imagentx.top$request_uri;
    }
}

# 非 www 只做一件事：301 到 www。
#
# 这两个主机名以前写在同一个 server 块里，也就是**同一份内容有两个都返回 200 的地址**
# （再乘以 /zh 与 /en 就是四个）。页面上又没有 canonical，搜索引擎无从判断该收哪一个，
# 常见处理是先都不收——站点长期搜不到，这是原因之一。
# 规范主机名定为 www，与 src/lib/constants.ts 的 SITE_URL、sitemap.xml、canonical 一致，
# **改这里就要一起改那边**，否则 canonical 指向一个会 301 的地址，等于自相矛盾。
#
# 这个块排在前面，于是也成了 443 的 default_server：用 IP 或其它域名指过来的请求
# 同样被收拢到 www，不会再多出一份可索引的重复内容。
server {
    listen 443 ssl http2;
    server_name imagentx.top;

    ssl_certificate     /etc/nginx/ssl/imagentx.top.pem;
    ssl_certificate_key /etc/nginx/ssl/imagentx.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    return 301 https://www.imagentx.top$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.imagentx.top;

    # 证书：阿里云免费 DV 证书下载后放到该路径，或 Let's Encrypt
    ssl_certificate     /etc/nginx/ssl/imagentx.top.pem;
    ssl_certificate_key /etc/nginx/ssl/imagentx.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 请求体上限放宽（授权码/订单等 POST 场景），默认 1m 偏小
    client_max_body_size 10m;

    # 显式声明日志路径与格式（公安备案要求日志留存 ≥ 60 天）
    access_log /var/log/nginx/meteor-store/imagentx.top.access.log imagentx;
    error_log  /var/log/nginx/meteor-store/imagentx.top.error.log warn;

    # Ex-Memory 与 Meteor Store 共用的服务间鉴权令牌（文件权限 600）。
    include /etc/nginx/private/ex-memory-proxy-token.conf;

    # 文本类静态资源由 nginx 自己压缩。Next 的 compress 只作用于它自己发出的响应，
    # 下面几个 location 直接发盘、不经过 Node，漏掉这段等于把 css/svg/json 明文发出去。
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml model/gltf+json;

    # ---------------------------------------------------------------------------
    # 静态资源直接由 nginx 发盘，不再穿过 Node
    #
    # 这台机器只有 2G 内存，而 public/ 有近 90MB（chakra 的特效视频、骨骼模型的
    # .glb 就占了大头）。原来每个字节都要过一遍 Node 进程，纯属浪费——nginx 发静态
    # 文件还能顺带拿到 sendfile 与原生 Range 支持（视频拖动进度条就靠后者）。
    #
    # 两条 public/ 规则都以 `try_files $uri @app` 收尾：盘上有就发盘，没有就回落给 Node。
    # 这条兜底很关键——正则万一多匹配了某个页面路由（比如将来某个 API 以 .json 结尾），
    # 也只是多一次 stat 失败，不会 404。
    #
    # 缓存头一律用 add_header 而不用 `expires`：两者同时写会发出**两个** Cache-Control 头，
    # 而 `immutable` / `must-revalidate` 只有 add_header 表达得了。
    # ---------------------------------------------------------------------------

    # Next 构建产物：文件名自带 content hash，可以放心永久缓存。
    # `^~` 让它压过下面的正则 location，否则 _next/static 里的 .css 会被正则抢走，
    # 跑去 public/ 找一圈再回落，白白多一次 stat。
    #
    # 这里**不写 `try_files`**：nginx 的 try_files 与 alias 同用时路径拼接会算错
    # （是个陈年已知问题）。而且 _next/static 本来也不该回落给 Node——文件名带 hash，
    # 找不到就是真的没有，404 才是正确答案。
    location ^~ /_next/static/ {
        alias /var/www/meteor-store/.next/static/;
        add_header Cache-Control $meteor_static_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # Service Worker 与它硬编码引用的那几个文件：**绝不能长缓存**。
    # sw.js 一旦被缓存住，用户就卡在旧 Service Worker 上，连「发一版自注销脚本」
    # 这个唯一的补救手段都推不下去。这几个路径互相硬编码引用，没法靠内容 hash 长缓存。
    # 必须排在下面那条通用规则前面——正则 location 按出现顺序匹配，写反了就被通用规则吃掉。
    location ~ ^/(sw\.js|offline\.html|meteor-runner\.js|manifest\.webmanifest)$ {
        root /var/www/meteor-store/public;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri @app;
    }

    # MediaPipe 运行时包含 .js / .data / .binarypb / .wasm。不能按 .js 全局放行，
    # 否则 /blog/tag/Three.js 这类合法页面会被当成静态文件；按固定目录直出既避免
    # next-intl 重定向，也避免大模型文件经过 Node。
    #
    # **`^~` 会绕过下面所有正则 location**，所以重资源防护必须在这里重复一遍——
    # 否则这里 11.4MB 的 .wasm/.data（全站第二大）完全不受保护。
    #
    # limit_conn 取 8：MediaPipe 初始化时并行取 .data + .wasm + .binarypb，
    # 叠加应用自身的视频请求，真实页面峰值约 6 个并发。**这个 zone 与下面重资源规则共用**，
    # 两处的计数会累加，改动任一处的数值都要同时考虑另一处。
    location ^~ /vendor/mediapipe/ {
        root /var/www/meteor-store/public;
        types {
            application/javascript js;
            application/wasm wasm;
            application/octet-stream data binarypb;
        }
        default_type application/octet-stream;

        # 只挡外域热链。none 必须放行：MediaPipe 由页面 JS 以 fetch 加载，
        # 部分隐私扩展会剥掉 Referer，挡住它会让手势应用直接白屏。
        valid_referers none blocked server_names
                       *.imagentx.top imagentx.top
                       *.baidu.com *.google.com *.bing.com *.sogou.com *.so.com
                       *.openai.com *.anthropic.com *.perplexity.ai;
        if ($invalid_referer) {
            return 403;
        }

        limit_conn meteor_heavy_conn 8;
        limit_conn_status 429;
        limit_rate 1m;

        # 不带 always：403/429 不写缓存头，避免被误伤的用户被缓存按住一整天。
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # 重资源防护：大体积二进制文件（.glb 模型 / .wasm / 视频）
    #
    # 这些文件单个 1~16MB，是全站最容易被盗链、也最容易被单个客户端拖垮带宽的部分。
    # 日志实测单文件传输峰值约 1.7MB/s，出口不大，一个多线程下载器就能占满。
    #
    # **必须排在下面那条通用后缀规则之前** —— 正则 location 按出现顺序匹配，
    # 写反了就被通用规则吃掉，下面的 limit_conn / valid_referers 全部失效。
    #
    # 后缀名单是原通用规则里那一组的子集，**刻意不新增**（如 .data/.binarypb）：
    # 博客标签由用户自定义，`/zh/blog/tag/Three.js` 就是真实存在的例子，
    # 每多一个后缀就多一分「合法页面被当成静态文件」的风险。
    # MediaPipe 的 .data/.binarypb 由上面 `^~ /vendor/mediapipe/` 那条单独兜住。
    #
    # 三层防护：
    #   1. valid_referers —— 只允许站内页面、搜索引擎、以及**无 Referer** 的请求。
    #      这是防「大规模盗链」的主力：limit_conn 按 IP 计数，挡不住一个热门页面
    #      带来的成千上万次不同 IP 的引用，只有 Referer 校验能一刀切掉。
    #      允许 `none` 是刻意的：搜索引擎与 AI 爬虫（GPTBot / Baiduspider 等）抓取时
    #      不带 Referer，挡住它们会直接损失收录与 AI 可见性，得不偿失。
    #      日志实测 /downloads/ 的 DMG 下载也全部是无 Referer 的直连。
    #   2. limit_conn —— 单 IP 最多 8 个并发。取 8 而非更低，是因为正常浏览也会并发：
    #      chakra 体验页要同时取 3 个 MediaPipe 运行时 + 若干演示视频（约 6 个）。
    #      它挡的是「几十线程的下载器」，不是正常用户。
    #   3. limit_rate —— 单连接 1MB/s。服务器峰值才 1.7MB/s，这个值让单个连接
    #      最多用掉约六成带宽，正常看演示短片绰绰有余，而把盗链成本抬高。
    #
    # 只覆盖二进制大文件，**不动 png/webp/svg/ico** —— og-image.png 与品牌图
    # 会被社交平台（微信、Twitter）和目录站以外域 Referer 抓取，对图片加防盗链
    # 会导致分享卡片直接裂图。图片走下面的通用规则，保持原行为。
    #
    # ⚠️ Cache-Control 这里**故意不写 always**：403 会命中防盗链分支，
    # 若给错误响应也打上 max-age=86400，浏览器与中间缓存会把它记住一整天，
    # 用户一旦被误伤就整天打不开。不带 always 时 nginx 只给 2xx/3xx 加这个头。
    # ---------------------------------------------------------------------------
    location ~* ^/.+\.(glb|gltf|wasm|mp4|webm|mov|bin)$ {
        root /var/www/meteor-store/public;

        valid_referers none blocked server_names
                       *.imagentx.top imagentx.top
                       *.baidu.com *.google.com *.bing.com *.sogou.com *.so.com
                       *.openai.com *.anthropic.com *.perplexity.ai;
        if ($invalid_referer) {
            return 403;
        }

        limit_conn meteor_heavy_conn 8;
        limit_conn_status 429;
        limit_rate 1m;

        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri @app;
    }

    # public/ 下的其余静态资源。
    #
    # **`js` 不在这份后缀名单里**，和 src/proxy.ts 的 matcher 同一个理由：博客标签
    # 是用户可自定义的，`Three.js` 已经是现有文章的标签，拿 `js` 后缀一刀切会让
    # /zh/blog/tag/Three.js 被当成静态文件。public/ 里的脚本只有 sw.js 与
    # meteor-runner.js，已由上一条按文件名单独处理；构建产物的 js 走 _next/static。
    #
    # 缓存只给一天：这些文件名不带 content hash（demo.mp4、alipay-qr.png 都是固定名），
    # 收款码这类还会定期换图，长缓存会把用户留在旧图上。
    #
    # 注意：上面那条重资源规则已经吃掉了 glb/gltf/wasm/mp4/webm/mov/bin，
    # 这里的名单**不要重复列出它们**——重复不会出错，但会让人误以为它们走的是这条。
    # 特别地，`.data` / `.binarypb` 不在重资源名单里，是它们只存在于
    # /vendor/mediapipe/（由上面 `^~` 那条兜住），而这两个后缀一旦放开到全站，
    # 会与「用户自定义博客标签」撞车的风险远大于收益。
    location ~* ^/.+\.(png|jpg|jpeg|gif|webp|avif|svg|ico|css|txt|xml|html|json|md|woff|woff2|ttf)$ {
        root /var/www/meteor-store/public;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri @app;
    }

    # ex-memory 本地助手安装包使用版本化路径，直接由 nginx 提供 Range 下载。
    #
    # 这里**刻意不加 valid_referers**：安装包是给人下载的，用户会把直链贴到群聊、
    # 论坛、issue 里，Referer 来自任何域名都属正常。对下载链接做防盗链，
    # 收益极小（本来就无「热链盗用」场景）而误伤面很大。
    # 只加带宽与并发限制——DMG 单个 22MB，是本站最大的单次传输。
    #
    # limit_conn 取 4（比上面重资源的 8 更严）：正常下载是单线程的，
    # 多线程下载器才有并发，4 已足够覆盖「同时下几个版本」的场景。
    location ^~ /downloads/ex-memory/ {
        alias /var/www/downloads/ex-memory/;
        autoindex off;
        types {
            application/x-apple-diskimage dmg;
            application/json json;
            text/plain sha256;
        }
        default_type application/octet-stream;

        limit_conn meteor_heavy_conn 4;
        limit_conn_status 429;
        limit_rate 1m;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # 仅供 auth_request 内部子请求使用，浏览器不能直接访问。
    location = /_ex_memory_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/internal/ex-memory-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Ex-Memory-Proxy-Token $ex_memory_proxy_token;
    }

    # Ex-Memory 在线体验：先由 Meteor Store 校验登录态，再转发可信用户身份。
    location ^~ /ex-memory-runtime/ {
        auth_request /_ex_memory_auth;
        auth_request_set $ex_memory_user_id $upstream_http_x_ex_memory_user_id;

        proxy_pass http://127.0.0.1:18000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ex-Memory-User-Id $ex_memory_user_id;
        proxy_set_header X-Ex-Memory-Proxy-Token $ex_memory_proxy_token;
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # try_files 的兜底目标：盘上找不到就交回 Node，与 location / 保持一致。
    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
