# 部署到 /etc/logrotate.d/imagentx.top
# 公安备案要求日志留存 ≥ 60 天
#
# 部署方式：scp 到服务器后执行 logrotate 配置安装（由 deploy-local.sh 自动完成）

# Nginx 访问/错误日志 —— 按天轮转，保留 60 天
# 独立子目录不与系统 /var/log/nginx/*.log 重叠，不修改其他站点的规则。
/var/log/nginx/meteor-store/imagentx.top.access.log
/var/log/nginx/meteor-store/imagentx.top.error.log {
    daily
    rotate 60
    create 0640 nginx root
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 "$(cat /var/run/nginx.pid)"
    endscript
}

# PM2 应用日志 —— 按天轮转，保留 60 天
/var/log/meteor-store/pm2-out*.log
/var/log/meteor-store/pm2-error*.log {
    daily
    rotate 60
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    sharedscripts
    postrotate
        /usr/bin/env PATH=/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin PM2_HOME=/root/.pm2 /usr/local/bin/pm2 reloadLogs
    endscript
}
