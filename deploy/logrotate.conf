# 部署到 /etc/logrotate.d/imagentx.top
# 公安备案要求日志留存 ≥ 60 天
#
# 部署方式：scp 到服务器后执行 logrotate 配置安装（由 deploy-local.sh 自动完成）

# Nginx 访问/错误日志 —— 按天轮转，保留 60 天
/var/log/nginx/imagentx.top.access.log
/var/log/nginx/imagentx.top.error.log {
    daily
    rotate 60
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 "$(cat /var/run/nginx.pid)"
    endscript
}

# PM2 应用日志 —— 按天轮转，保留 60 天
/var/log/meteor-store/pm2-out.log
/var/log/meteor-store/pm2-error.log {
    daily
    rotate 60
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    sharedscripts
    postrotate
        pm2 reload meteor-store --update-env > /dev/null 2>&1 || true
    endscript
}
