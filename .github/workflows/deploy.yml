name: Deploy to Aliyun (manual)

# 服务器只有 2G 内存，在服务器上 `pnpm build`（Next 16 Turbopack）会 OOM 被杀，
# 所以不再「push 即在服务器构建」。
# 现在部署有两种方式，都只在本地/GitHub Runner 构建、只上传产物：
#   1. 本地半自动（推荐）：bash deploy/deploy-local.sh
#   2. 本工作流（备选）：手动点 Run workflow，在 GitHub Runner（内存充足）构建后上传。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # pnpm 版本由 package.json 的 packageManager 唯一锁定，避免重复配置冲突
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build (on runner, 内存充足不会 OOM)
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SHOW_PRICING: ${{ secrets.NEXT_PUBLIC_SHOW_PRICING }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: SKIP_TYPE_CHECK=1 pnpm build

      - name: Package .next
        run: |
          tar -czf /tmp/meteor-store-next.tar.gz -C . .next
          echo "产物 $(du -h /tmp/meteor-store-next.tar.gz | cut -f1)"

      # scp-action 的 target 是远端「目录」而非文件名：它会把 source 打包后解压进该目录。
      # strip_components=1 去掉包内 tmp/ 前缀，落盘为 meteor-store-next.tar.gz
      - name: Upload .next.tar.gz to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          # 固定服务器 host key 指纹（ed25519），防止中间人。与 deploy/known_hosts 一致。
          # 换服务器/重装 SSH 时需更新（ssh-keygen -lf 查新指纹）。
          fingerprint: sha256 SHA256:u/GDF+oKy40D+MnU7E7rKABccdu9Xo7+/EcARH0ixzY
          source: /tmp/meteor-store-next.tar.gz
          target: /var/www/meteor-store
          strip_components: 1

      - name: Restart on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          fingerprint: sha256 SHA256:u/GDF+oKy40D+MnU7E7rKABccdu9Xo7+/EcARH0ixzY
          script: |
            set -euo pipefail
            cd /var/www/meteor-store
            # 确认上传的产物已就位
            test -f meteor-store-next.tar.gz
            # 直连 GitHub 官方源，不用第三方镜像（可投毒的供应链中间人）
            git remote set-url origin https://github.com/Meteorkid/meteor-store.git 2>/dev/null || true
            pull_succeeded=0
            for i in 1 2 3; do
              if git pull --ff-only origin main; then
                pull_succeeded=1
                break
              fi
              echo "git pull 第 $i 次失败，重试中..."
              sleep 5
            done
            if [[ "$pull_succeeded" != "1" ]]; then
              echo "ERROR: git pull 连续失败，终止部署" >&2
              exit 1
            fi
            # 安装失败必须终止部署——带着旧 node_modules 跑新产物是未定义行为
            pnpm install --frozen-lockfile
            pm2 stop meteor-store 2>/dev/null || true
            rm -rf .next.rollback
            if [[ -d .next ]]; then mv .next .next.rollback; fi
            tar -xzf meteor-store-next.tar.gz
            rm -f meteor-store-next.tar.gz
            pm2 restart meteor-store --update-env
            pm2 save
            echo "==> 部署完成，BUILD_ID: $(cat .next/BUILD_ID)"
